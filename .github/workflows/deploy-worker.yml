name: Deploy Worker

# Closed product tags (v1.2.3) deploy pinar-prd. Prerelease tags
# (v1.2.3-rc.1, v1.0.0-0, alpha, beta) deploy pinar-stg. Extension tags
# (ext-v*) never run this workflow. Requires CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets. D1 migrations stay manual.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Product tag to deploy (vX.Y.Z or vX.Y.Z-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify tag
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.tag.outputs.channel }}
      kind: ${{ steps.tag.outputs.kind }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - id: tag
        name: Classify the product tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bun scripts/release-tag.mjs --github-output "$RELEASE_TAG"

  production:
    name: Deploy production Worker
    needs: classify
    if: needs.classify.outputs.kind == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.tag }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the production artifact
        env:
          CLOUDFLARE_ENV: production
        run: bun run build:server
      - name: Inspect the production artifact
        run: bun scripts/assert-worker-artifact.mjs production
      - name: Deploy pinar-prd
        env:
          CI: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/server
        run: bunx wrangler deploy --env production
      - name: Smoke production health
        env:
          EXPECTED: ${{ needs.classify.outputs.version }}
        run: |
          set -euo pipefail
          body="$(curl -fsS https://pinar.dev/api/health)"
          echo "$body"
          echo "$body" | bun -e '
            const json = JSON.parse(await Bun.stdin.text());
            const expected = process.env.EXPECTED;
            if (json.ok !== true || json.service !== "pinar" || json.version !== expected) {
              throw new Error(`health ${JSON.stringify(json)} does not match ${expected}`);
            }
          '

  staging:
    name: Deploy staging Worker
    needs: classify
    if: needs.classify.outputs.kind == 'prerelease'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.classify.outputs.tag }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the staging artifact
        env:
          CLOUDFLARE_ENV: staging
        run: bun run build:server
      - name: Inspect the staging artifact
        run: bun scripts/assert-worker-artifact.mjs staging
      - name: Deploy pinar-stg
        env:
          CI: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/server
        run: bunx wrangler deploy --env staging
