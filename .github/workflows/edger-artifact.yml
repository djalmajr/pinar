name: EdgeR Artifact

# Builds the server's EdgeR artifact (apps/server/dist/pinar-edger.zip) and
# runs it under Deno. It installs nothing and reads no secret: installing on
# EdgeR stays a manual, authorized step (apps/server/scripts/edger-install.ts).
# Product tags (v1.2.3, v1.2.3-rc.1) keep the zip as a workflow artifact for
# that step. Extension tags (ext-v*) never run this workflow.

on:
  pull_request:
    paths:
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/edger-artifact.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edger-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    name: Build and smoke the EdgeR artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # EdgeR runs workers on the latest denoland/deno image.
          deno-version: v2.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the EdgeR artifact
        working-directory: apps/server
        run: bun run build:edger
      - name: Run the artifact under Deno
        working-directory: apps/server
        run: bun run smoke:edger
      - name: Keep the artifact of a product tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pinar-edger-${{ github.ref_name }}
          path: apps/server/dist/pinar-edger.zip
          if-no-files-found: error
          retention-days: 30
