name: Release Pinar.app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing product release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarize, and publish Pinar.app
    runs-on: macos-14
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Hutch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- --version 0.25.0 --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          test "$RELEASE_TAG" = "v$version"
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_TAG"
          bun run release:check
      - name: Prepare Developer ID and notarization credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey.p8"
          keychain="$RUNNER_TEMP/pinar-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$certificate"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$api_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "ELECTROBUN_DEVELOPER_ID=$identity" >> "$GITHUB_ENV"
          echo "ELECTROBUN_APPLEAPIKEYPATH=$api_key" >> "$GITHUB_ENV"
          echo "ELECTROBUN_APPLEAPIKEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
          echo "ELECTROBUN_APPLEAPIISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
      - name: Build signed and notarized app
        run: bun run build:tray
      - name: Verify notarization
        shell: bash
        run: |
          set -euo pipefail
          xcrun stapler validate apps/tray/artifacts/macos-arm64-Pinar.dmg
          spctl --assess --verbose=4 --type install apps/tray/artifacts/macos-arm64-Pinar.dmg
      - name: Upload artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" --clobber \
            apps/tray/artifacts/macos-arm64-Pinar.dmg \
            apps/tray/artifacts/stable-macos-arm64-Pinar.app.tar.zst \
            apps/tray/artifacts/stable-macos-arm64-update.json \
            apps/tray/artifacts/stable-macos-arm64-*.patch
          gh release edit "$RELEASE_TAG" --draft=false --latest

  windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Hutch
        run: |
          $ErrorActionPreference = "Stop"
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1))) -Version 0.25.0 -NoModifyPath
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE ".hutch\bin")
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = bun -e "console.log(JSON.parse(await Bun.file('package.json').text()).version)"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $($env:RELEASE_TAG) does not match package.json $version"
          }
          $at = git describe --exact-match --tags HEAD
          if ($at -ne $env:RELEASE_TAG) {
            throw "HEAD is $at, expected $($env:RELEASE_TAG)"
          }
          bun run release:check
      - name: Build Windows installer
        run: bun run build:tray
      - name: Verify Windows artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = "apps/tray/artifacts"
          $build = "apps/tray/build/stable-win-x64"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          function Show-Files([string] $path) {
            if (-not (Test-Path $path)) {
              Write-Host "missing directory $path"
              return
            }
            Get-ChildItem $path -File | ForEach-Object {
              Write-Host ("{0}`t{1}" -f $_.Length, $_.Name)
            }
          }
          Write-Host "build:"
          Show-Files $build
          Write-Host "artifacts before collect:"
          Show-Files $artifacts
          $setupSrc = Join-Path $build "Pinar-Setup.exe"
          $setupDst = Join-Path $artifacts "win-x64-Pinar-Setup.exe"
          if (-not (Test-Path $setupDst)) {
            if (-not (Test-Path $setupSrc)) { throw "Missing $setupSrc" }
            Copy-Item $setupSrc $setupDst
            Write-Host "copied $setupSrc -> $setupDst"
          }
          Write-Host "artifacts after collect:"
          Show-Files $artifacts
          $tarball = Join-Path $artifacts "stable-win-x64-Pinar.tar.zst"
          $manifestPath = Join-Path $artifacts "stable-win-x64-update.json"
          foreach ($path in @($setupDst, $tarball)) {
            if (-not (Test-Path $path)) { throw "Missing $path" }
            if ((Get-Item $path).Length -lt 1024) { throw "$path is too small" }
          }
          if (-not (Test-Path $manifestPath)) { throw "Missing $manifestPath" }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $expectedVersion = $env:RELEASE_TAG.TrimStart("v")
          if ($manifest.version -ne $expectedVersion) {
            throw "update.json version $($manifest.version) does not match $expectedVersion"
          }
          if ($manifest.artifact.file -ne "stable-win-x64-Pinar.tar.zst") {
            throw "update.json artifact.file is $($manifest.artifact.file)"
          }
      - name: Upload Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view $env:RELEASE_TAG | Out-Null
          $files = @(
            "apps/tray/artifacts/win-x64-Pinar-Setup.exe",
            "apps/tray/artifacts/stable-win-x64-Pinar.tar.zst",
            "apps/tray/artifacts/stable-win-x64-update.json"
          )
          $patches = Get-ChildItem "apps/tray/artifacts/stable-win-x64-*.patch" -ErrorAction SilentlyContinue
          if ($patches) { $files += $patches.FullName }
          gh release upload $env:RELEASE_TAG --clobber @files
