name: Release extension

on:
  push:
    tags: ["extension-v*"]

permissions:
  contents: write

jobs:
  release:
    name: Package and publish extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - id: extension
        name: Validate tag, version, and notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#extension-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid extension tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          manifest_version="$(bun -e 'console.log(JSON.parse(await Bun.file("extension/manifest.json").text()).version)')"
          package_version="$(bun -e 'console.log(JSON.parse(await Bun.file("apps/extension/package.json").text()).version)')"
          if [[ "$version" != "$manifest_version" || "$version" != "$package_version" ]]; then
            echo "Tag $version, manifest $manifest_version, and package $package_version must match" >&2
            exit 1
          fi
          notes="extension/releases/$version.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing extension release notes: $notes" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Typecheck
        run: bun run typecheck
      - name: Test extension release surface
        run: bun run test:ext
      - name: Build and package extension
        run: bun run package:ext -- --expected-version "${{ steps.extension.outputs.version }}"
      - name: Publish independent extension release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.extension.outputs.notes }}
          VERSION: ${{ steps.extension.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "extension/pinar-extension-$VERSION.zip"
          --latest=false
          --notes-file "$NOTES"
          --title "Pinar Extension $VERSION"
          --verify-tag
