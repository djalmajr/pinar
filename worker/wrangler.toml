name = "pinar"
main = "src/index.js"
compatibility_date = "2024-08-01"
workers_dev = true

routes = [
  { pattern = "pinar.dev", custom_domain = true },
  { pattern = "www.pinar.dev", custom_domain = true }
]

[assets]
directory = "../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# R2 bucket for screenshots
[[r2_buckets]]
binding = "PINAR_BUCKET"
bucket_name = "pinar-shots"

# D1 database for history persistence
[[d1_databases]]
binding = "DB"
database_name = "pinar-history"
database_id = "7b572f21-7dff-43c0-9d13-38fd50c827f4"

# Daily cleanup job (runs at 03:00 UTC)
[triggers]
crons = ["0 3 * * *"]

[vars]
STRIPE_PRICE_MONTHLY = "price_1U4OH1JlxS9HAOyog32haJQ1"
STRIPE_PRICE_YEARLY = "price_1U4OH5JlxS9HAOyonThna75s"
STRIPE_PRICE_LIFETIME = "price_1U4PQ3JlxS9HAOyo2N6VeS0t"
# Configure secrets outside source control:
# npx wrangler secret put STRIPE_SECRET_KEY
